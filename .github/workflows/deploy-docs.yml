name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install Node dependencies
        working-directory: website
        run: npm ci --engine-strict=false || npm install --legacy-peer-deps --no-audit

      - name: Build Docusaurus
        working-directory: website
        run: npm run build

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site/docs
          cp -r website/build/* _site/docs/
          if [ -f website/build/llms.txt ]; then
            cp website/build/llms.txt _site/llms.txt
          fi
          if [ -f website/build/llms-full.txt ]; then
            cp website/build/llms-full.txt _site/llms-full.txt
          fi
          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting to Haishui Agent Docs...</title>
            <meta http-equiv="refresh" content="0; url=docs/">
            <script>window.location.replace("docs/" + window.location.search + window.location.hash);</script>
          </head>
          <body>
            <p>Redirecting to <a href="docs/">docs/</a>...</p>
          </body>
          </html>
          EOF
          touch _site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages (Actions Mode)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to gh-pages branch (Branch Mode Fallback)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
